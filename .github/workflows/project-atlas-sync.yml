name: Sync Project Atlas snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-atlas-snapshot-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Mosaic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Check out the Project Atlas source of truth
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pyscriptcli/project-atlas
          ref: main
          path: .project-atlas-source
          persist-credentials: false

      - name: Replace the checked-in Atlas snapshot
        shell: bash
        run: |
          set -euo pipefail
          atlas_commit="$(git -C .project-atlas-source rev-parse HEAD)"
          mkdir -p project-atlas
          rsync -a --delete --exclude='.git' .project-atlas-source/ project-atlas/
          rm -rf .project-atlas-source
          printf '{\n  "repository": "pyscriptcli/project-atlas",\n  "ref": "main",\n  "commit": "%s"\n}\n' "$atlas_commit" > project-atlas-sync.json

      - name: Commit snapshot changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- project-atlas project-atlas-sync.json
          if git diff --cached --quiet; then
            echo "Project Atlas snapshot is already current."
            exit 0
          fi
          git commit -m "chore(atlas): sync Project Atlas snapshot"
          git push origin HEAD:main